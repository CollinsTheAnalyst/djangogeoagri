{% extends "base.html" %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-3xl mx-auto bg-white p-8 shadow-md rounded-2xl">
    
    <h1 class="text-4xl font-bold text-green-700 mb-4">{{ post.title }}</h1>
    <p class="text-gray-500 mb-6">By {{ post.author }} • {{ post.created_at|date:"F d, Y" }}</p>
    
    {% if post.image %}
      <img src="{{ post.image.url }}" class="w-full rounded-xl mb-6" alt="{{ post.title }}">
    {% endif %}
    
    <div class="prose prose-green max-w-none text-gray-800">
      {{ post.content|safe }}
    </div>
    
    <div class="mt-8">
      <a href="{% url 'blog_list' %}" class="text-green-600 hover:text-green-800">← Back to Blog</a>
    </div>
  </div>
</div>
{% endblock %}
